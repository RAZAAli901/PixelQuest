name: PixelQuest Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build Signed Release & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Ensure Debug Keystore Exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Decode Keystore Secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/pixelquest-release.jks
          else
            rm -f app/pixelquest-release.jks
          fi

      # A tag like v1.2.0 must match the versionName inside the APK, so the release page and the
      # app's own version agree (and versionCode was bumped along with it).
      - name: Check Version Matches Tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          NAME=$(sed -n 's/^ *versionName *= *"\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          if [ "${TAG%%-*}" != "$NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match versionName '$NAME' in app/build.gradle.kts. Bump versionName and versionCode first."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches versionName $NAME."

      # Missing secrets don't stop a release, but the run and the release notes say what's missing.
      - name: Check Release Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          : > RELEASE_WARNINGS.md
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 is not set: the release APK is signed with a debug key made for this run only."
            echo "> **Signed with a one-off debug key.** Android won't install it over an earlier PixelQuest release; uninstall first (back up your progress in Settings before you do)." >> RELEASE_WARNINGS.md
          fi
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::SUPABASE_URL or SUPABASE_ANON_KEY is not set: sign-in, cloud sync, the leaderboard and the AI Coach won't work in this build."
            echo "> **Built without a Supabase project.** Sign-in, cloud sync, the leaderboard and the AI Coach are unavailable in this build." >> RELEASE_WARNINGS.md
          elif [ -z "$GOOGLE_WEB_CLIENT_ID" ]; then
            echo "::warning::GOOGLE_WEB_CLIENT_ID is not set: this build has no Sign in with Google button (email-code sign-in still works)."
            echo "> **Built without a Google sign-in client id.** Sign in with Google isn't available in this build; players can sign in with a code sent by email." >> RELEASE_WARNINGS.md
          fi

      - name: Inject Supabase & OAuth Build Secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          echo "SUPABASE_URL=${SUPABASE_URL:-https://placeholder-project.supabase.co}" >> local.properties
          echo "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-placeholder-anon-key}" >> local.properties
          echo "GOOGLE_WEB_CLIENT_ID=${GOOGLE_WEB_CLIENT_ID:-}" >> local.properties
          # APKs built here are public, so even the debug one reaches Gemini only through the
          # gemini-proxy Edge Function. The Gemini key is never given to a build.
          echo "GEMINI_VIA_PROXY=true" >> local.properties

      - name: Build Debug & Release APKs
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/app/pixelquest-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew compileDebugKotlin assembleDebug assembleRelease

      # With the keystore secret present, the APK must be signed with the PixelQuest release key
      # (app/release-signing-cert.sha256), or it couldn't update existing installs: fail instead.
      - name: Verify Release Signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No release keystore secret: skipping the certificate check (this APK is debug-signed)."
            exit 0
          fi
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          ACTUAL=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | tr -d '\r' | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          EXPECTED=$(tr -d ' \r\n' < app/release-signing-cert.sha256)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::The release APK is signed with '$ACTUAL', not the PixelQuest release key ($EXPECTED). Check the keystore secrets."
            exit 1
          fi
          echo "Release APK signed with the PixelQuest release key ($EXPECTED)."

      - name: Generate Release Notes
        run: |
          cat RELEASE_WARNINGS.md > RELEASE_NOTES.md
          if [ -s RELEASE_WARNINGS.md ]; then echo "" >> RELEASE_NOTES.md; fi
          if [ -f "CHANGELOG.md" ]; then
            cat CHANGELOG.md >> RELEASE_NOTES.md
          else
            git log --oneline -n 20 >> RELEASE_NOTES.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PixelQuest Release ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: false
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
