name: PixelQuest Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build Signed Release & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK Fallback / Release Pre-check
        run: ./gradlew assembleDebug
