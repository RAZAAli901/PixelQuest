name: PixelQuest Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build Signed Release & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      # The runner has 16 GB. With gradle.properties' 2 GB, compiling debug and release together ran
      # the Kotlin compiler out of memory on some runs (2026-10-22: "Java heap space" in IR lowering).
      - name: Give the build more memory
        run: |
          echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" >> gradle.properties
          echo "kotlin.daemon.jvmargs=-Xmx4g" >> gradle.properties

      - name: Ensure Debug Keystore Exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Decode Keystore Secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/pixelquest-release.jks
          else
            rm -f app/pixelquest-release.jks
          fi

      # A tag like v1.2.0 must match the versionName inside the APK, so the release page and the
      # app's own version agree (and versionCode was bumped along with it).
      - name: Check Version Matches Tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          NAME=$(sed -n 's/^ *versionName *= *"\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          if [ "${TAG%%-*}" != "$NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match versionName '$NAME' in app/build.gradle.kts. Bump versionName and versionCode first."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches versionName $NAME."

      # Missing secrets don't stop a release, but the run and the release notes say what's missing.
      - name: Check Release Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          : > RELEASE_WARNINGS.md
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 is not set: the release APK is signed with a debug key made for this run only."
            echo "> **Signed with a one-off debug key.** Android won't install it over an earlier PixelQuest release; uninstall first (back up your progress in Settings before you do)." >> RELEASE_WARNINGS.md
          fi
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::SUPABASE_URL or SUPABASE_ANON_KEY is not set: sign-in, cloud sync, the leaderboard and the AI Coach won't work in this build."
            echo "> **Built without a Supabase project.** Sign-in, cloud sync, the leaderboard and the AI Coach are unavailable in this build." >> RELEASE_WARNINGS.md
          elif [ -z "$GOOGLE_WEB_CLIENT_ID" ]; then
            echo "::warning::GOOGLE_WEB_CLIENT_ID is not set: this build has no Sign in with Google button (email-code sign-in still works)."
            echo "> **Built without a Google sign-in client id.** Sign in with Google isn't available in this build; players can sign in with a code sent by email." >> RELEASE_WARNINGS.md
          fi

      - name: Inject Supabase & OAuth Build Secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          FCM_API_KEY: ${{ secrets.FCM_API_KEY }}
          FCM_APP_ID: ${{ secrets.FCM_APP_ID }}
          FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}
          FCM_SENDER_ID: ${{ secrets.FCM_SENDER_ID }}
          EMAIL_SIGN_IN: ${{ vars.EMAIL_SIGN_IN }}
        run: |
          echo "SUPABASE_URL=${SUPABASE_URL:-https://placeholder-project.supabase.co}" >> local.properties
          echo "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-placeholder-anon-key}" >> local.properties
          echo "GOOGLE_WEB_CLIENT_ID=${GOOGLE_WEB_CLIENT_ID:-}" >> local.properties
          # Push for chess challenges (docs/PUSH_SETUP.md): the Firebase app's public settings. Blank: push off.
          echo "FCM_API_KEY=${FCM_API_KEY:-}" >> local.properties
          echo "FCM_APP_ID=${FCM_APP_ID:-}" >> local.properties
          echo "FCM_PROJECT_ID=${FCM_PROJECT_ID:-}" >> local.properties
          echo "FCM_SENDER_ID=${FCM_SENDER_ID:-}" >> local.properties
          # APKs built here are public, so even the debug one reaches Gemini only through the
          # gemini-proxy Edge Function. The Gemini key is never given to a build.
          echo "GEMINI_VIA_PROXY=true" >> local.properties
          # Email-code sign-in needs an email service on the Supabase project, or the codes reach
          # only its team (docs/CLOUD_SETUP.md, step 3). It's off in releases until the repository
          # variable EMAIL_SIGN_IN is set to true.
          echo "EMAIL_SIGN_IN=${EMAIL_SIGN_IN:-false}" >> local.properties

      - name: Build Debug & Release APKs
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/app/pixelquest-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew compileDebugKotlin assembleDebug assembleRelease

      # With the keystore secret present, the APK must be signed with the PixelQuest release key
      # (app/release-signing-cert.sha256), or it couldn't update existing installs: fail instead.
      - name: Verify Release Signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No release keystore secret: skipping the certificate check (this APK is debug-signed)."
            exit 0
          fi
          # The build-tools the app builds with (AGP 8.3's 34.0.0). The runner's newest one printed
          # nothing this check could read, which failed v1.2.0's first release run.
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          [ -x "$BUILD_TOOLS/apksigner" ] || BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          CERTS=$("$BUILD_TOOLS/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk 2>&1 | tr -d '\r') || true
          ACTUAL=$(printf '%s\n' "$CERTS" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          EXPECTED=$(tr -d ' \r\n' < app/release-signing-cert.sha256)
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            # What apksigner said, and which APKs were built (certificates and file names only).
            echo "apksigner from $BUILD_TOOLS:"
            echo "$CERTS"
            ls -la app/build/outputs/apk/release/ || true
            echo "::error::The release APK is signed with '$ACTUAL', not the PixelQuest release key ($EXPECTED). Check the keystore secrets."
            exit 1
          fi
          echo "Release APK signed with the PixelQuest release key ($EXPECTED)."

      # The same size budget as the CI build (build.yml, docs/APK_SIZE_AUDIT.md), on the APK that ships.
      - name: Check the APK's size
        run: |
          BYTES=$(stat -c %s app/build/outputs/apk/release/app-release.apk)
          echo "Release APK: $BYTES bytes (budget 8,000,000)."
          if [ "$BYTES" -gt 8000000 ]; then
            echo "::error::The release APK is over its 8,000,000-byte budget. See docs/APK_SIZE_AUDIT.md."
            exit 1
          fi

      - name: Generate Release Notes
        run: |
          cat RELEASE_WARNINGS.md > RELEASE_NOTES.md
          if [ -s RELEASE_WARNINGS.md ]; then echo "" >> RELEASE_NOTES.md; fi
          if [ -f "CHANGELOG.md" ]; then
            cat CHANGELOG.md >> RELEASE_NOTES.md
          else
            git log --oneline -n 20 >> RELEASE_NOTES.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PixelQuest Release ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: false
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
