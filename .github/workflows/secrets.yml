name: Secret scan

# S005: every push and pull request is scanned for secrets, the whole history included. A finding
# fails the run; with "Secret scan" made a required check on main (Settings > Branches), it blocks merges.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Our own rules (scripts/security/scan_secrets.py): Supabase keys by role, Google keys,
      # private keys, literal passwords. Prints locations and fingerprints, never values.
      - name: PixelQuest secret rules
        run: python3 scripts/security/scan_secrets.py --history

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
