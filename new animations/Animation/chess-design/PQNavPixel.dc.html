<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
</helmet>
<div style="width:100%; height:76px; box-sizing:border-box; background:#fffaf0; border-top:2px solid #2b2622; display:grid; grid-template-columns:repeat(5,1fr); align-items:start; padding:8px 6px 0; position:relative; flex:none;">
  <div style="display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer;">
    <sc-if value="{{ isHome }}" hint-placeholder-val="{{ true }}"><div style="width:50px; height:30px; box-sizing:border-box; border:2px solid #2b2622; background:#fde7a0; display:flex; align-items:center; justify-content:center;"><span style="font-family:'Material Symbols Rounded'; font-size:22px; line-height:1; font-variation-settings:'FILL' 1; color:#c25e00;">home</span></div></sc-if>
    <sc-if value="{{ notHome }}"><div style="width:50px; height:30px; display:flex; align-items:center; justify-content:center;"><span style="font-family:'Material Symbols Rounded'; font-size:22px; line-height:1; color:#6e655a;">home</span></div></sc-if>
    <div style="font:7px 'Press Start 2P'; color:#2b2622;">HOME</div>
  </div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer;">
    <sc-if value="{{ isQuests }}"><div style="width:50px; height:30px; box-sizing:border-box; border:2px solid #2b2622; background:#fde7a0; display:flex; align-items:center; justify-content:center;"><span style="font-family:'Material Symbols Rounded'; font-size:22px; line-height:1; font-variation-settings:'FILL' 1; color:#c25e00;">checklist</span></div></sc-if>
    <sc-if value="{{ notQuests }}"><div style="width:50px; height:30px; display:flex; align-items:center; justify-content:center;"><span style="font-family:'Material Symbols Rounded'; font-size:22px; line-height:1; color:#6e655a;">checklist</span></div></sc-if>
    <div style="font:7px 'Press Start 2P'; color:#2b2622;">QUESTS</div>
  </div>
  <div style="display:flex; justify-content:center;">
    <div style="width:56px; height:56px; margin-top:-28px; box-sizing:border-box; background:#c25e00; border:2px solid #2b2622; box-shadow:0 4px 0 #2b2622; display:flex; align-items:center; justify-content:center; cursor:pointer;" style-active="transform:translateY(3px); box-shadow:0 1px 0 #2b2622;"><span style="font-family:'Material Symbols Rounded'; font-size:30px; line-height:1; font-variation-settings:'FILL' 1; color:#fffaf0;">emoji_events</span></div>
  </div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer;">
    <sc-if value="{{ isDeen }}"><div style="width:50px; height:30px; box-sizing:border-box; border:2px solid #2b2622; background:#fde7a0; display:flex; align-items:center; justify-content:center;"><span style="font-family:'Material Symbols Rounded'; font-size:22px; line-height:1; font-variation-settings:'FILL' 1; color:#c25e00;">brightness_3</span></div></sc-if>
    <sc-if value="{{ notDeen }}"><div style="width:50px; height:30px; display:flex; align-items:center; justify-content:center;"><span style="font-family:'Material Symbols Rounded'; font-size:22px; line-height:1; color:#6e655a;">brightness_3</span></div></sc-if>
    <div style="font:7px 'Press Start 2P'; color:#2b2622;">DEEN</div>
  </div>
  <div style="display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer;">
    <sc-if value="{{ isHero }}"><div style="width:50px; height:30px; box-sizing:border-box; border:2px solid #2b2622; background:#fde7a0; display:flex; align-items:center; justify-content:center;"><span style="font-family:'Material Symbols Rounded'; font-size:22px; line-height:1; font-variation-settings:'FILL' 1; color:#c25e00;">person</span></div></sc-if>
    <sc-if value="{{ notHero }}"><div style="width:50px; height:30px; display:flex; align-items:center; justify-content:center;"><span style="font-family:'Material Symbols Rounded'; font-size:22px; line-height:1; color:#6e655a;">person</span></div></sc-if>
    <div style="font:7px 'Press Start 2P'; color:#2b2622;">HERO</div>
  </div>
  <div style="position:absolute; bottom:6px; left:50%; margin-left:-60px; width:120px; height:4px; background:#2b2622;"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:110},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;quests&quot;,&quot;deen&quot;,&quot;hero&quot;,&quot;none&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'home';
    return {
      isHome: a === 'home', notHome: a !== 'home',
      isQuests: a === 'quests', notQuests: a !== 'quests',
      isDeen: a === 'deen', notDeen: a !== 'deen',
      isHero: a === 'hero', notHero: a !== 'hero'
    };
  }
}
</script>
</body>
</html>
